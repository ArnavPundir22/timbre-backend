services:
  - type: web
    name: timbre-api
    env: docker
    dockerfilePath: api/Dockerfile.render
    plan: free
    region: singapore
    envVars:
      - key: MIX_ENV
        value: prod
      - key: DATABASE_PATH
        value: /tmp/timbre.db
      - key: PORT
        value: 10000
      - key: SECRET_KEY_BASE
        generateValue: true
